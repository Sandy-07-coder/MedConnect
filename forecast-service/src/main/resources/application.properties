spring.application.name=forecast-service
server.port=8082

# URL of the Inventory Service — the only external dependency
inventory.service.base-url=http://localhost:8081

# ── Forecast thresholds (configurable without code changes) ───────────────────
forecast.risk.critical-days=3
forecast.risk.high-days=7
forecast.risk.medium-days=14

# Target coverage period for redistribution calculations (days)
forecast.redistribution.target-coverage-days=14

# Safety stock buffer as a multiplier of daily demand
forecast.redistribution.safety-stock-days=7

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.fail-on-empty-beans=false
