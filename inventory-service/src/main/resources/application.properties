spring.application.name=inventory-service
server.port=8081

# ── PostgreSQL datasource ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/mediconnect
spring.datasource.username=postgres
spring.datasource.password=sandy07
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update  → auto-creates / alters tables to match entities (fine for dev/PoC)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Jackson ───────────────────────────────────────────────────────────────────
# Prevents 500 errors when Hibernate lazy-loaded proxies hit the JSON serializer
spring.jackson.serialization.fail-on-empty-beans=false
